<html lang="en">

<head>
  <script>
  (function () {
    var path = window.location.pathname;

    if (path.endsWith(".html")) {
      var cleanPath = path.slice(0, -5);

      window.history.replaceState(
        null,
        "",
        cleanPath + window.location.search + window.location.hash
      );
    }
  })();
</script>
